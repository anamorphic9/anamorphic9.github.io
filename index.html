<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamimi — Photography</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 50px 8%;
    }

    h1 {
      font-size: 48px;
      margin: 0;
    }

    p {
      color: #aaa;
    }

    .gallery {
      padding: 20px 8% 80px;
      columns: 3;
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      display: block;
      margin-bottom: 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.02);
      opacity: 0.85;
    }

    @media (max-width: 800px) {
      .gallery {
        columns: 2;
      }
    }

    @media (max-width: 500px) {
      .gallery {
        columns: 1;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>HAMIMI</h1>
    <p>Photography / Wildlife / Aviation / Personal</p>
  </header>

  <main class="gallery">
    <img src="images/photo1.jpg">
    <img src="images/photo2.jpg">
    <img src="images/photo3.jpg">
    <img src="images/photo4.jpg">
    <img src="images/photo5.jpg">
    <img src="images/photo6.jpg">
  </main>

</body>
</html>
